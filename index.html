<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Відгуки про книжкову кав’ярню</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Книжкова кав’ярня «Сторінка»</h1>
    <button type="button" class="theme-btn" id="themeBtn">Темна тема</button>
  </header>

  <main class="layout">
    <section class="form-col" aria-labelledby="formTitle">
      <h2 id="formTitle">Залиште відгук</h2>
      <form id="reviewForm" novalidate>
        <label for="name">Ім’я</label>
        <input id="name" name="name" type="text" maxlength="30" autocomplete="name">
        <p class="error" data-error-for="name"></p>

        <label for="text">Ваш відгук</label>
        <textarea id="text" name="text" rows="5" maxlength="300"></textarea>
        <p class="counter"><span id="charCount">0</span> / 300</p>
        <p class="error" data-error-for="text"></p>

        <button type="submit" class="primary">Додати відгук</button>
        <p class="hint">Ctrl + Enter — швидке надсилання</p>
      </form>
    </section>

    <section class="list-col" aria-labelledby="listTitle">
      <div class="list-head">
        <h2 id="listTitle">Відгуки: <span id="reviewCount">0</span></h2>
        <div class="actions">
          <button type="button" id="likeBtn" class="like" aria-label="Подобається">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.3 1.1 4 2.2h4C14.7 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.500 16.400 12 21 12 21z"/></svg>
            <span id="likeCount">0</span>
          </button>
          <button type="button" id="clearBtn" class="ghost">Очистити всі</button>
        </div>
      </div>
      <input id="search" type="search" placeholder="Пошук серед відгуків…" aria-label="Пошук серед відгуків" autocomplete="off">
      <p id="emptyMsg" class="empty">Поки що відгуків немає. Напишіть перший.</p>
      <p id="noResults" class="empty hidden">За вашим запитом нічого не знайдено.</p>
      <ul id="reviewList" class="reviews"></ul>
    </section>
  </main>

  <button type="button" id="toTop" class="to-top hidden" aria-label="Нагору">↑</button>
</body>
</html>
